name: game_turbo_x
description: "Game Turbo X - Game Booster & Performance Analyzer premium untuk Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # UI / Material 3 / Animasi
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10+1

  # Device & Sistem (LEGAL, tanpa root)
  device_info_plus: ^10.1.0
  battery_plus: ^6.0.2
  connectivity_plus: ^6.0.3
  network_info_plus: ^5.0.3
  disk_space_plus: ^0.2.3
  package_info_plus: ^8.0.0

  # Daftar aplikasi terinstal (untuk Game Detector, legal via PackageManager)
  device_apps: ^2.1.0

  # Penyimpanan lokal
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Firebase
  firebase_core: ^3.1.0
  firebase_analytics: ^11.1.0
  firebase_crashlytics: ^4.0.1
  firebase_remote_config: ^5.0.1
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1

  # Ads
  google_mobile_ads: ^5.1.0

  # In-App Purchase (Premium)
  in_app_purchase: ^3.2.0

  # Permission & floating window (legal, via SYSTEM_ALERT_WINDOW)
  permission_handler: ^11.3.1

  # Utility
  intl: ^0.19.0
  equatable: ^2.0.5
  url_launcher: ^6.3.0
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
